[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "air-platform"
version = "0.2.0"
description = "AIR Platform integration tests and orchestration"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.26.0",
    "pytest>=7.4.0",
]

# This repo is Docker Compose orchestration plus integration tests, not a
# library. Nothing gets packaged: `pip install .` only pulls in the test deps.
[tool.setuptools]
packages = []
py-modules = []

[tool.pytest.ini_options]
pythonpath = ["."]
